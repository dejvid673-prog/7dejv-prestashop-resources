name: Validate source registry

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry, links, refs, and licenses
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-SourceRegistry.ps1
